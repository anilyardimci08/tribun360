name: Build and publish tribün360 APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tribun360-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tribun360.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tribun360-android-apk
          path: tribun360.apk
          if-no-files-found: error

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest tribun360.apk --title "tribün360 Son Sürüm" --notes "main dalındaki en güncel otomatik Android APK derlemesi."
