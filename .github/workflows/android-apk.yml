name: Build and publish tribün360 Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tribun360-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Prepare optional release keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.TRIBUN360_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/release.keystore
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK and AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.TRIBUN360_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIBUN360_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRIBUN360_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease \
              -PTRIBUN360_STORE_FILE=../release.keystore \
              -PTRIBUN360_STORE_PASSWORD="$STORE_PASSWORD" \
              -PTRIBUN360_KEY_ALIAS="$KEY_ALIAS" \
              -PTRIBUN360_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease bundleRelease
          fi

      - name: Prepare artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tribun360-v1.1.1-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab tribun360-v1.1.1-release.aab
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk tribun360-v1.1.1-release.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk tribun360-v1.1.1-release-unsigned.apk
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tribun360-android-v1.1.1
          path: |
            tribun360-v1.1.1-debug.apk
            tribun360-v1.1.1-release*.apk
            tribun360-v1.1.1-release.aab
          if-no-files-found: error

      - name: Publish installable beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep previous releases available for rollback.
          gh release create android-v1.1.1 tribun360-v1.1.1-debug.apk \
            --title "tribün360 Android 1.1.1" \
            --notes "Android 1.1.1: HTTP error screen, loading timeout, state restoration recovery and WebView diagnostics. Debug APK test kurulumu içindir. Play Store release signing için repository secrets gerekir."

